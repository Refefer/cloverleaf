[package]
name = "cloverleaf"
version = "0.5.0"
edition = "2021"

[features]
default = []
# The Python bindings.  maturin turns this on (see pyproject.toml); Rust users don't need it.
python = ["dep:pyo3"]
accelerate = ["candle-core/accelerate"]
metal = ["candle-core/metal"]
cuda = ["candle-core/cuda"]

[lib]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
name = "cloverleaf"
crate-type = ["cdylib", "rlib"]

[dependencies]
ahash = "0.8"
rand = "0.8.6"
rand_xorshift = "0.3"
rand_distr = "0.4"
rayon = "1.5"
float-ord = "0.2"
atomic_float = "0.1"
pyo3 = { version = "0.30", optional = true }
candle-core = "0.11.1"
indicatif = "0.18.6"
itertools = "0.10.5"
ryu = "1.0"
lasso = "0.7.2"

[dependencies.flate2]
version = "1.1"
features = ["zlib-rs"]

[dependencies.hashbrown]
version = "0.13"
features = ["rayon"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench_algos"
harness = false

[[bench]]
name = "bench_policy_evaluation"
harness = false

[profile.bench]
debug = true

[profile.release]
debug = true
